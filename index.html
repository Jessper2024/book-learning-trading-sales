    body {

    main {

      color: #586970;

    .quick {

      gap: 14px;
      margin: 26px 0 36px;
    }
    a {

      box-shadow: 0 10px 24px rgba(40, 38, 32, 0.06);

    .tile {

      padding: 18px;
      display: flex;

      justify-content: space-between;
    }
    .tile strong,

      color: #315e72;
      font-weight: 400;
    }
    .tile span {
      color: #6a5e4b;
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .book {
      padding: 22px;
    }
    .book h2 {
      margin: 0 0 14px;
      font-size: 25px;
    }
    .links {
      display: grid;
      gap: 10px;
    }
    .links a {
      display: block;
      border-left: 4px solid #9f4730;
      background: #f7f3ec;
      padding: 10px 12px;
      color: #26383f;
    }
    .meta {
      margin-top: 34px;
      color: #69757a;
      font-size: 14px;
    }
    @media (max-width: 760px) {
      main { padding: 28px 16px 44px; }
      .quick,
      .grid { grid-template-columns: 1fr; }
      .lead { font-size: 16px; }
